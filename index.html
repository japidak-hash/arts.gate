<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التسجيل الرسمية - أكاديمية الفنون</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        :root {
            --bg-color: #0a0705; 
            --text-color: #fcf6eb; 
            --accent-gold: #F2C572; 
            --accent-sand: #D9B48F; 
            --border-color: rgba(242, 197, 114, 0.15);
            --nebula-glow: rgba(242, 197, 114, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 20px 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%; left: 50%;
            width: 700px; height: 700px;
            background: radial-gradient(circle, var(--nebula-glow) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -2;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            opacity: 0.6;
        }

        .academy-affiliation-badge {
            background: rgba(242, 197, 114, 0.08);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(242, 197, 114, 0.1);
        }

        .registration-container {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 11, 8, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .registration-container.hidden {
            opacity: 0;
            transform: scale(0.9) translateY(-30px);
            display: none;
        }

        .header-zone {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-zone h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(242, 197, 114, 0.3);
            margin-bottom: 8px;
        }

        .header-zone p {
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-sand);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            text-align: right;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(242, 197, 114, 0.15);
        }

        .form-group input[type="file"] {
            padding: 10px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        .optional-badge {
            font-size: 0.8rem;
            opacity: 0.5;
            font-weight: normal;
            margin-right: 5px;
        }
        
        .security-box {
            background: rgba(242, 60, 60, 0.05);
            border: 1px dashed rgba(242, 197, 114, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .specialties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .specialty-item {
            position: relative;
        }

        .specialty-item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0; width: 0;
        }

        .specialty-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
        }

        .specialty-label .moon-tag {
            font-size: 0.75rem;
            opacity: 0.5;
            font-family: Arial, sans-serif;
            margin-top: 2px;
        }

        .specialty-item input[type="checkbox"]:checked + .specialty-label {
            background: rgba(242, 197, 114, 0.12);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(242, 197, 114, 0.2);
            transform: translateY(-2px);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #D18A39 100%);
            border: none;
            border-radius: 14px;
            color: #0a0705;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 8px 25px rgba(242, 197, 114, 0.25);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(242, 197, 114, 0.4);
            filter: brightness(1.1);
        }

        .submit-btn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .card-result-zone {
            width: 100%;
            max-width: 500px;
            display: none;
            opacity: 0;
            transform: scale(0.95) translateY(20px);
            flex-direction: column;
            align-items: center;
        }

        .card-result-zone.show {
            display: flex;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .membership-card {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, rgba(15, 11, 8, 0.95) 0%, rgba(30, 22, 16, 0.95) 100%);
            border: 1px solid rgba(242, 197, 114, 0.3);
            border-radius: 24px;
            padding: 25px;
            position: relative;
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 40px rgba(242, 197, 114, 0.05) inset;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .membership-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(242, 197, 114, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .card-rings-decor {
            position: absolute;
            bottom: -20px;
            left: -30px;
            width: 180px;
            height: 60px;
            border: 2px solid rgba(242, 197, 114, 0.15);
            border-radius: 50%;
            transform: rotate(-25deg);
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(242, 197, 114, 0.2);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .card-logo h2 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 1px;
            font-family: Arial, sans-serif;
            text-transform: lowercase;
        }

        .card-logo p {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 2px;
        }

        .member-id-badge {
            background: rgba(242, 197, 114, 0.1);
            border: 1px solid rgba(242, 197, 114, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-family: monospace;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .card-body {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex: 1;
        }

        .card-avatar-container {
            flex: 0 0 100px;
            height: 100px;
            border-radius: 12px;
            border: 2px solid rgba(242, 197, 114, 0.3);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #cardAvatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-member-info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .primary-info {
            display: flex;
            flex-direction: column;
            margin-bottom: 2px;
        }

        .display-nickname {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: -2px;
        }

        .display-name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            opacity: 0.9;
        }

        .display-phone {
            font-size: 0.8rem;
            opacity: 0.5;
            font-family: monospace;
            direction: ltr;
            text-align: right;
            margin-top: -2px;
        }

        .display-bio {
            font-size: 0.85rem;
            opacity: 0.7;
            font-style: italic;
            border-right: 2px solid var(--accent-gold);
            padding-right: 8px;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            box-orient: vertical;
            overflow: hidden;
        }

        .card-specialties-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 10px;
        }

        .card-spec-badge {
            font-size: 0.7rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 30px;
            color: var(--text-color);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: rgba(242, 197, 114, 0.06);
            border: 1px dashed var(--accent-gold);
            border-radius: 16px;
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .academy-gate-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(242, 197, 114, 0.1);
        }

        .success-title {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent-gold);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .dev-footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: rgba(217, 180, 143, 0.4);
            text-align: center;
            letter-spacing: 0.5px;
            font-weight: 500;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="academy-affiliation-badge">الموقع الرسمي التابع لأكاديمية الفنون</div>

    <div class="registration-container" id="regFormContainer">
        <div class="header-zone">
            <h1>أكاديمية الفنون</h1>
            <p>سجل بياناتك الآن لإنشاء بطاقة عضويتك الفورية الفريدة</p>
        </div>

        <form id="academyRegistrationForm" onsubmit="generateMembership(event)">
            
            <input type="text" id="botTrap" style="display: none !important;" tabindex="-1" autocomplete="off">

            <div class="form-group">
                <label for="inputPhoto">صورة العضو / الهوية الفنية <span class="optional-badge">(اختياري)</span></label>
                <input type="file" id="inputPhoto" accept="image/png, image/jpeg, image/webp" onchange="previewUserPhoto(event)">
            </div>

            <div class="form-group">
                <label for="inputName">الاسم الكامل</label>
                <input type="text" id="inputName" placeholder="اكتب اسمك الثلاثي أو الثنائي..." maxlength="40" required>
            </div>

            <div class="form-group">
                <label for="inputNickname">اللقب / الهوية الفنية (اسم الشهرة)</label>
                <input type="text" id="inputNickname" placeholder="مثال: فنان الفضاء, ماركو, الساحر..." maxlength="25" required>
            </div>

            <div class="form-group">
                <label>تخصصاتك الفنية</label>
                <div class="specialties-grid">
                    <div class="specialty-item">
                        <input type="checkbox" id="spec-titan" value="الرسم (Titan)">
                        <label for="spec-titan" class="specialty-label">
                            <span>الرسم</span>
                            <span class="moon-tag">Titan</span>
                        </label>
                    </div>
                    <div class="specialty-item">
                        <input type="checkbox" id="spec-rhea" value="التلوين (Rhea)">
                        <label for="spec-rhea" class="specialty-label">
                            <span>التلوين</span>
                            <span class="moon-tag">Rhea</span>
                        </label>
                    </div>
                    <div class="specialty-item">
                        <input type="checkbox" id="spec-iapetus" value="التصوير (Iapetus)">
                        <label for="spec-iapetus" class="specialty-label">
                            <span>التصوير</span>
                            <span class="moon-tag">Iapetus</span>
                        </label>
                    </div>
                    <div class="specialty-item">
                        <input type="checkbox" id="spec-enceladus" value="التصميم (Enceladus)">
                        <label for="spec-enceladus" class="specialty-label">
                            <span>التصميم</span>
                            <span class="moon-tag">Enceladus</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="inputPhone">رقم الهاتف</label>
                <input type="tel" id="inputPhone" placeholder="07XXXXXXXX" maxlength="15" required style="direction: ltr; text-align: left;">
            </div>

            <div class="form-group">
                <label for="inputBio">نبذة شخصية <span class="optional-badge">(اختياري - سطر واحد)</span></label>
                <textarea id="inputBio" rows="1" maxlength="70" placeholder="اكتب عبارة ملهمة تمثلك كفنان..."></textarea>
            </div>

            <div class="form-group security-box">
                <label id="mathCaptchaLabel">درع الأمان: يرجى حل العملية الحسابية 🛡️</label>
                <input type="number" id="mathCaptchaInput" placeholder="أدخل الناتج هنا..." required>
            </div>

            <button type="submit" class="submit-btn">إصدار بطاقة العضوية وتأكيد الانضمام 🌌</button>
        </form>
    </div>

    <div class="card-result-zone" id="cardResultZone">
        <h2 class="success-title">✨ مبارك! تم اعتماد عضويتك بنجاح</h2>
        <div class="membership-card" id="membershipCardDiv">
            <div class="card-rings-decor"></div>
            <div class="card-header">
                <div class="card-logo">
                    <h2>saturn academy</h2>
                    <p>أكاديمية الفنون - بطاقة معتمدة</p>
                </div>
                <div class="member-id-badge" id="cardMemberId">SAT-2026-XXXX</div>
            </div>
            <div class="card-body">
                <div class="card-avatar-container">
                    <img src="" alt="صورة العضو" id="cardAvatar">
                </div>
                <div class="card-member-info-panel">
                    <div class="primary-info">
                        <span class="display-nickname" id="cardNickname"></span>
                        <span class="display-name" id="cardName"></span>
                    </div>
                    <div class="display-phone" id="cardPhone"></div>
                    <div class="display-bio" id="cardBio"></div>
                    <div class="card-specialties-container" id="cardSpecialties"></div>
                </div>
            </div>
        </div>
        <button class="download-btn" id="cardDownloadBtn" onclick="downloadCardAsImage()">
            <span>تحميل البطاقة كصورة (HD) 💾</span>
        </button>
        <a href="https://chat.whatsapp.com/EIJogTGiz1dKOvZNKh4hJD" target="_blank" class="academy-gate-btn">
            <span>الانتقال ودخول مجتمع الأكاديمية 🚀</span>
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // ==========================================
        // 🟢 الرابط الجديد لقاعدة البيانات الذي قمت بتوفيره
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbylMfrJmtndnX4ZpfHcM6K1ISmvyhDukoDVMA8ju5khej97eInlIXrpdn_R_CGhLTRgYQ/exec";
        
        // 🔴 لا تنسَ وضع مفتاح ImgBB الخاص بك هنا لكي تعمل ميزة رفع الصور
        const IMGBB_API_KEY = "ضع_مفتاح_IMGBB_هنا"; 
        // ==========================================

        let userPhotoUrl = ""; 
        
        let captchaNum1 = 0;
        let captchaNum2 = 0;

        function generateCaptcha() {
            captchaNum1 = Math.floor(Math.random() * 10) + 1;
            captchaNum2 = Math.floor(Math.random() * 10) + 1;
            document.getElementById('mathCaptchaLabel').innerText = `درع الأمان: كم حاصل جمع ${captchaNum1} + ${captchaNum2}؟ 🛡️`;
            document.getElementById('mathCaptchaInput').value = "";
        }

        window.onload = function() {
            generateCaptcha();
        };

        function previewUserPhoto(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { userPhotoUrl = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            } else {
                userPhotoUrl = "";
            }
        }

        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    return data.data.url; 
                }
            } catch (error) {
                console.error("خطأ أثناء رفع الصورة:", error);
            }
            return ""; 
        }

        async function generateMembership(event) {
            event.preventDefault();

            const botTrap = document.getElementById('botTrap').value;
            if (botTrap !== "") {
                alert("تم رصد نشاط غير طبيعي، تم إلغاء الطلب.");
                return;
            }

            const userAnswer = parseInt(document.getElementById('mathCaptchaInput').value);
            if (userAnswer !== (captchaNum1 + captchaNum2)) {
                alert("إجابة سؤال الأمان خاطئة. يرجى المحاولة مرة أخرى.");
                generateCaptcha();
                return;
            }

            const lastSubmissionTime = localStorage.getItem('saturn_last_submission');
            if (lastSubmissionTime && (Date.now() - parseInt(lastSubmissionTime) < 60000)) {
                alert("لقد قمت بإرسال طلب مؤخراً. يرجى الانتظار لمدة دقيقة قبل المحاولة مرة أخرى لمنع الضغط على السيرفر.");
                return;
            }

            const submitBtn = document.querySelector('.submit-btn');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "جاري رفع البيانات وإصدار البطاقة... ⏳";
            submitBtn.disabled = true;

            const name = document.getElementById('inputName').value.trim().substring(0, 40);
            const nickname = document.getElementById('inputNickname').value.trim().substring(0, 25);
            const phone = document.getElementById('inputPhone').value.trim().substring(0, 15);
            let bio = document.getElementById('inputBio').value.trim().substring(0, 70);
            
            if(bio === "") bio = "عضو مبدع في فضاء أكاديمية ساترن للفنون الكونية.";

            const checkboxes = document.querySelectorAll('.specialties-grid input[type="checkbox"]:checked');
            let selectedSpecs = Array.from(checkboxes).map(cb => cb.value);
            if(selectedSpecs.length === 0) selectedSpecs.push("فنون عامة");

            const randomId = "SAT-" + new Date().getFullYear() + "-" + Math.floor(1000 + Math.random() * 9000);

            let finalPhotoUrl = "";
            const photoFile = document.getElementById('inputPhoto').files[0];
            if (photoFile) {
                if(IMGBB_API_KEY === "ضع_مفتاح_IMGBB_هنا") {
                    console.warn("تنبيه: لم تقم بإضافة مفتاح ImgBB، سيتم إكمال التسجيل بدون صورة في قاعدة البيانات.");
                } else {
                    finalPhotoUrl = await uploadImageToImgBB(photoFile);
                }
            }

            const payload = {
                name: name,
                nickname: nickname,
                phone: phone,
                bio: bio,
                specialties: selectedSpecs.join(', '),
                memberId: randomId,
                photoUrl: finalPhotoUrl 
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.result === "duplicate") {
                    alert("عذراً! هذا اللقب مستخدم ومحجوز مسبقاً. اختر لقباً آخر.");
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                    generateCaptcha();
                    return; 
                }

                if (data.result === "error") throw new Error("Server error");

                localStorage.setItem('saturn_last_submission', Date.now().toString());

                document.getElementById('cardName').innerText = name;
                document.getElementById('cardNickname').innerText = nickname;
                document.getElementById('cardPhone').innerText = phone;
                document.getElementById('cardBio').innerText = `"${bio}"`;
                document.getElementById('cardMemberId').innerText = randomId;

                const cardAvatar = document.getElementById('cardAvatar');
                if (userPhotoUrl && photoFile) {
                    cardAvatar.src = userPhotoUrl; 
                    cardAvatar.style.opacity = 1;
                } else {
                    cardAvatar.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0idmFyKC0tYWNjZW50LWdvbGQpIj48cGF0aCBkPSJNMTIgMTEuNWMtMi41OCAwLTQuNjk0LTIuMDY3LTQuNjk0LTQuNjI1QzcuMzA2IDQuMzA4IDkuNDE4IDIuMjUgMTIgMi4yNXM0LjY5NCAyLjA1OCA0LjY5NCA0LjYyNUMxNi42OTQgOS40MzMgMTQuNTggMTEuNSAxMiAxMS41em05IDIuMjV2Ny41Yy0uMzIgMC0uNDk4LS4zMjktLjUyMS0uNDcyLTEuNzgzLTUuMTQyLTkuMDI3LTUuMTQyLTkuODI5IDBINGMtLjI1IDAtLjQwNS4zMTgtLjUyMS40NzJ2LTcuNWguMjV6bS05IDYuNzVjLjggMCAxLjUtLjcxMyAxLjUtMS41cy0uNy0xLjUtMS41LTEuNVMxMC41IDE5Ljg5NiAxMC41IDIwLjc1czcuMTUxIDEuNSAxLjUgMS41eiIvPjwvc3ZnPg==";

                const specContainer = document.getElementById('cardSpecialties');
                specContainer.innerHTML = ''; 
                selectedSpecs.forEach(spec => {
                    const badge = document.createElement('span');
                    badge.className = 'card-spec-badge';
                    badge.innerText = spec;
                    specContainer.appendChild(badge);

                document.getElementById('regFormContainer').style.display = 'none';
                const resultZone = document.getElementById('cardResultZone');
                resultZone.style.display = 'flex';
                setTimeout(() => resultZone.classList.add('show'), 50);

            } catch (error) {
                console.error("Error:", error);
                alert("حدث خطأ في الاتصال بالسيرفر. يرجى المحاولة مجدداً.");
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
                generateCaptcha();
            }
        }

        function downloadCardAsImage() {
            const cardElement = document.getElementById('membershipCardDiv');
            const downloadBtn = document.getElementById('cardDownloadBtn');
            const nickname = document.getElementById('cardNickname').innerText.trim() || "Saturn-Artist";

            downloadBtn.innerText = "جاري التقاط الصورة... ⏳";
            downloadBtn.disabled = true;

            html2canvas(cardElement, {
                scale: 3, 
                backgroundColor: null, 
                useCORS: true, 
                allowTaint: true, 
                logging: false,
                width: cardElement.offsetWidth,
                height: cardElement.offsetHeight
            }).then(canvas => {
                const imageURI = canvas.toDataURL('image/png', 1.0);
                const createLink = document.createElement('a');
                createLink.download = `Saturn-Card-${nickname}.png`;
                createLink.href = imageURI;
                document.body.appendChild(createLink);
                createLink.click();
                document.body.removeChild(createLink);

                downloadBtn.innerText = "تحميل البطاقة كصورة (HD) 💾";
                downloadBtn.disabled = false;
            }).catch(error => {
                alert("حدث خطأ أثناء تصدير الصورة.");
                downloadBtn.innerText = "تحميل البطاقة كصورة (HD) 💾";
                downloadBtn.disabled = false;
            });
        }
    </script>
